version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./apps/api
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env
    depends_on:
      - mongo
    volumes:
      - ./apps/api:/usr/src/app

volumes:
  mongo_data:
